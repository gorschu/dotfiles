[Unit]
# Noctalia supplies the authentication overlay in Niri sessions.
ConditionEnvironment=!XDG_CURRENT_DESKTOP=niri

[Service]
# Set KDE integration only under Niri; preserve other desktops' environment.
ExecStart=
ExecStart=%h/.local/libexec/niri-kde-environment /usr/libexec/kf6/polkit-kde-authentication-agent-1
