# Codex and Claude selectors map to GitHub repositories. A null Codex source uses its hosted catalog.
codex:
  plugins:
    agent-skills@agent-skills: addyosmani/agent-skills
    modern-go-guidelines@goland-codex-marketplace: JetBrains/go-modern-guidelines

claude:
  plugins:
    agent-skills@addy-agent-skills: addyosmani/agent-skills
    modern-go-guidelines@goland-claude-marketplace: JetBrains/go-modern-guidelines

# Antigravity installs directly from the URL of the plugin root.
agy:
  plugins:
    agent-skills: https://github.com/addyosmani/agent-skills.git
    modern-go-guidelines: https://github.com/JetBrains/go-modern-guidelines/tree/main/plugin
